name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  # Replaces the workflow-level `paths-ignore` that used to sit on both
  # triggers. A workflow skipped by a path filter never reports its check
  # contexts, so the ruleset's required checks stayed pending for ever and a
  # docs-only pull request could never be merged. A job skipped by `if:`
  # reports success instead, which does satisfy the ruleset.
  # https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide whether the rest of the workflow needs to run
        id: filter
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            range="$BASE_SHA...HEAD"
          else
            range="$BEFORE_SHA..HEAD"
          fi

          # Anything unexpected - a first push, a force push, a pruned object -
          # runs the full workflow rather than silently skipping it.
          if ! files=$(git diff --name-only "$range" 2>/dev/null); then
            echo "Could not diff $range; running the workflow."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md|docs/*|.github/FUNDING.yml|.github/workflows/release.yml) continue ;;
            esac
            echo "relevant change: $f"
            code=true
          done <<< "$files"

          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = "true" ] || echo "Only ignored paths changed; downstream jobs will skip."

  build-and-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore IntelcomTracker.Tests/ --locked-mode

      - name: Build
        run: dotnet build IntelcomTracker.Tests/ --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test IntelcomTracker.Tests/
          --configuration Release --no-build
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Generate coverage report
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator \
            -reports:"coverage/**/coverage.cobertura.xml" \
            -targetdir:coverage/report \
            -reporttypes:MarkdownSummaryGithub

      - name: Write coverage to job summary
        run: cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post coverage as PR comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh pr comment "${{ github.event.pull_request.number }}"
          --repo "${{ github.repository }}"
          --body-file coverage/report/SummaryGithub.md
